
spring.application.name=backend

# Load local environment configuration
spring.config.import=optional:file:.env[.properties]

# MYSQL DATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/itinerary_planner?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# EMAIL / GMAIL
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# WEATHER API
weather.api.forecast-url=${WEATHER_FORECAST_URL}
weather.api.air-quality-url=${WEATHER_AIR_QUALITY_URL}
weather.api.historical-url=${WEATHER_HISTORICAL_URL}

# WEATHER SETTINGS
weather.forecast-days=${WEATHER_FORECAST_DAYS:7}
weather.timezone=${WEATHER_TIMEZONE:auto}
weather.temperature-unit=${WEATHER_TEMPERATURE_UNIT:celsius}
weather.wind-speed-unit=${WEATHER_WIND_SPEED_UNIT:kmh}
weather.precipitation-unit=${WEATHER_PRECIPITATION_UNIT:mm}

# SERVER
server.port=${SERVER_PORT:8080}
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
# =====================================================================
# ITINERARY GENERATOR (all optional - these are the defaults)
# =====================================================================
# Clock time of departure on the first trip day. 00:00 = start at midnight.
itinerary.departure-time=05:00
# Earliest hour a visit may start when a destination has no opening time.
# Use 00:00 to allow visits at any hour of the 24-hour day.
itinerary.earliest-visit-time=06:00
# Used only when a destination has no expected duration (and flagged as estimated).
itinerary.default-visit-minutes=90
# Added on top of the OSRM driving time (traffic, stops). 0 = use OSRM time as-is.
itinerary.travel-buffer-percent=10
itinerary.travel-buffer-minutes=0
# A longer leg is split into chunks of at most this many minutes with a break between.
itinerary.max-continuous-travel-minutes=300
itinerary.rest-stop-minutes=20
# After this many awake minutes an overnight stay is inserted (if the dates allow).
itinerary.max-awake-minutes=960
itinerary.overnight-rest-minutes=480
# Meal windows: HH:mm-HH:mm/minutes
itinerary.meal.breakfast=07:00-10:30/30
itinerary.meal.lunch=12:00-15:00/45
itinerary.meal.dinner=19:00-22:30/45

