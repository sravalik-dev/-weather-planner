
spring.application.name=backend

# Load local environment configuration
spring.config.import=optional:file:.env[.properties]

# MYSQL DATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/itinerary_planner?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# EMAIL / GMAIL
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# WEATHER API
weather.api.forecast-url=${WEATHER_FORECAST_URL}
weather.api.air-quality-url=${WEATHER_AIR_QUALITY_URL}
weather.api.historical-url=${WEATHER_HISTORICAL_URL}

# WEATHER SETTINGS
weather.forecast-days=${WEATHER_FORECAST_DAYS:7}
weather.timezone=${WEATHER_TIMEZONE:auto}
weather.temperature-unit=${WEATHER_TEMPERATURE_UNIT:celsius}
weather.wind-speed-unit=${WEATHER_WIND_SPEED_UNIT:kmh}
weather.precipitation-unit=${WEATHER_PRECIPITATION_UNIT:mm}

# SERVER
server.port=${SERVER_PORT:8080}
